name: Python & uv setup
description: Sets up Python and uv with dependency caching for a given version.
inputs:
  python-version:
    description: Python version to install (e.g. "3.12" or "3.14").
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true
        cache-suffix: ${{ inputs.python-version }}

    - name: Install dependencies
      run: uv sync --all-groups
      shell: bash
