[project]
name = "sqlalchemy-pytest"
version = "0.0.1"
description = ""
authors = [
    {name = "Doctor", email = "thirvondukr@gmail.com"},
]
dependencies = [
    "anyio>=3.6.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-pep517>=1.0"]
build-backend = "pdm.pep517.api"

[tool.pdm]
[tool.pdm.dev-dependencies]
dev = [
    "black>=22.12.0",
    "isort>=5.11.4",
    "mypy>=0.991",
    "pytest>=7.2.1",
    "coverage>=7.1.0",
    "ruff>=0.0.236",
    "commitizen>=2.40.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.9.2",
    "python-dotenv>=0.21.1",
    "asyncpg>=0.27.0",
]

[tool.coverage.run]
source = ["sqlalchemy_pytest"]
command_line = "-m pytest -v"
concurrency = ["greenlet"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "$version"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2

[tool.mypy]
follow_imports = "silent"
ignore_missing_imports = true

check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

strict_optional = true
strict_equality = true

[tool.isort]
profile = "black"


[tool.ruff]
src = ["sqlalchemy_pytest", "tests"]
select = ["ALL"]
ignore = [
    "E501", # Line Length
    "D", # pydocstyle
    "PD",  # pandas-vet
    "I",  # Isort
    "INP",
    "EXE",
    "TCH001",
    "TCH002",
    "TCH003",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.mccabe]
max-complexity = 6

[tool.pdm.scripts]
lint = {composite = [
    "black .",
    "isort .",
    "ruff .",
    "mypy .",
]}
test = {composite = [
    "coverage run",
    "coverage report",
]}
