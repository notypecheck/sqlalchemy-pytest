[project]
name = "sqlalchemy-pytest"
version = "0.3.2.post1"
description = ""
authors = [
    { name = "Noel", email = "notypecheck@gmail.com" },
]
dependencies = [
    "anyio>=3.6.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-pep517>=1.0"]
build-backend = "pdm.pep517.api"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "commitizen>=4.19.2",
    "sqlalchemy[asyncio]>=2.0.55",
]
lint = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]
test = [
    "coverage>=7.16.2",
    "python-dotenv>=1.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.15.0",
]

[tool.uv]
default-groups = "all"


[tool.coverage.run]
source = ["sqlalchemy_pytest"]
command_line = "-m pytest -v"
concurrency = ["greenlet"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.2.post1"
tag_format = "$version"
version_files = [
    "sqlalchemy_pytest/__init__.py",
    "pyproject.toml:version"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["sqlalchemy_pytest"]

[tool.ruff]
src = ["sqlalchemy_pytest", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", # Line Length
    "D", # pydocstyle
    "PD", # pandas-vet
    "I", # Isort
    "INP",
    "EXE",
    "TC001",
    "TC002",
    "TC003",
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 6
