image: docker


variables:
  IMAGE_PYTHON: python:3.10-slim

stages:
  - lint
  - publish

.lint-job: &lint_job
  image: $IMAGE_PYTHON
  stage: lint
  interruptible: true
  cache:
    - key:
        files:
          - pdm.lock
      paths:
        - .venv
        - .cache/pip
    - key: $CI_COMMIT_REF_SLUG
      paths:
        - .ruff_cache
        - .mypy_cache
  only:
    changes:
      - "**/*.py"
      - pdm.lock
      - pyproject.toml
      - .gitlab-ci.yml

  before_script:
    - pip install pdm
    - pdm install
  variables:
    GIT_STRATEGY: clone
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

mypy:
  <<: *lint_job
  script:
    - pdm run mypy .

black:
  <<: *lint_job
  script:
    - pdm run black . --check

isort:
  <<: *lint_job
  script:
    - pdm run isort . --check

ruff:
  <<: *lint_job
  script:
    - pdm run ruff .


.test-job: &test-job
  <<: *lint_job
  script:
    - pdm run coverage run
    - pdm run coverage report -m
    - pdm run coverage xml
  coverage: "/^TOTAL.*\\s(\\d*)/"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-postgresql:
  <<: *test-job
  variables:
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@postgres/postgres

  services:
    - postgres:14


test-sqlite:
  <<: *test-job
  variables:
    TEST_DATABASE_URL: sqlite+aiosqlite:///db.sqlite3


publish:
  <<: *lint_job
  stage: publish
  when: manual
  only:
    - tags
  except:
    - branches
  script:
    - >
      pdm publish
      --password ${PYPI_PASSWORD}
      --username ${PYPI_USERNAME}
